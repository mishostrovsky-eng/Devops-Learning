name: Spidey Live CD Simulation

on:
  pull_request:
    branches: [ "main" ]    # יופעל כשיש פעילות על PR לענף main
    types: [ closed ]       # יופעל אך ורק כאשר ה-PR נסגר
  workflow_dispatch:        # מאפשר הפעלה ידנית מתוך ממשק ה-Actions בגיטהאב

jobs:
  deploy-to-production:
    # ירוץ רק אם ה-PR אכן אושר ונכנס (Merged) או שהופעל ידנית דרך הממשק
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    
    runs-on: self-hosted # מריץ את הפקודות ישירות על השרת המקומי שלך

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # מוריד את הקוד המעודכן לשרת

      - name: Deploy with Docker Compose
        run: |
          echo "🚀 מתחיל תהליך פריסה לשרת..."
          docker compose down
          docker compose up -d --build
          echo "✅ הפריסה הסתיימה בהצלחה! האפליקציה באוויר."