name: Spidey CI

on:
  pull_request:
    branches: [ main ]
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Build the full stack with Docker Compose ---
      - name: Build Docker images
        run: docker compose build

      - name: Start the application stack
        run: docker compose up -d

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for http://localhost to respond..."
          for i in {1..30}; do
            if curl -sSf http://localhost > /dev/null; then
              echo "✅ Frontend is up!"
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "❌ Frontend did not become ready in time"
          docker compose logs
          exit 1

      # --- Install and run the E2E tests ---
      - name: Install E2E test dependencies
        working-directory: ./e2e-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ./e2e-tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-taests/playwright-report/
          retention-days: 7

      # --- Tear down ---
      - name: Stop the application stack
        if: always()
        run: docker compose down

      - name: Run Local Custom Action
        uses: ./.github/actions/spidey-check
